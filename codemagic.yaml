
workflows:
  flutter-windows:
    name: Flutter Windows Desktop Build
    max_build_duration: 60
    instance_type: windows_x2

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Enable Windows desktop
        script: flutter config --enable-windows-desktop

      - name: Check Windows project
        script: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Build Windows Release
        script: flutter build windows --release

      - name: Package Windows app
        script: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "Flutter-Windows.zip" `
            -Force

    artifacts:
      - Flutter-Windows.zip
      - build/windows/x64/runner/Release/**

    publishing:
      email:
        recipients:
          - gqikdubrjntorldfieo36@gmail.com
        notify:
          success: true
          failure: true
